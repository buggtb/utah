name: Tacklebox ISO verify (temporary)
# TEMPORARY narrow verification for PR #252: exercises
# iso/scripts/build-iso-tacklebox.sh + tacklebox-iso job steps in CI without
# depending on a green Build Utah run (red main, see #248). DELETE before
# merge -- durable coverage is the tacklebox-iso job in post-testing-e2e.yml.
on:
  push:
    branches: [feat/tacklebox-live-iso]
  workflow_dispatch:
    inputs:
      image_digest:
        description: Utah image digest to build from
        required: false
        default: sha256:ddb525723e773c73380347b2803442e7b114af389c52358595d5fc727255a4e9
        type: string

permissions: {}

jobs:
  tacklebox-iso:
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare ISO and QEMU host
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y podman skopeo uidmap slirp4netns fuse-overlayfs \
            squashfs-tools xorriso dosfstools mtools qemu-system-x86 qemu-utils \
            ovmf
          mkdir -p evidence
          df -h .
      - name: Build the ISO with tacklebox
        run: |
          set -euo pipefail
          sudo bash iso/scripts/build-iso-tacklebox.sh main testing ghcr "${{ inputs.image_digest }}" 1 \
            2>&1 | tee evidence/tbx-build.log
      - name: Verify the ISO with tacklebox
        run: |
          set -euo pipefail
          sudo podman pull ghcr.io/tuna-os/tacklebox:latest
          sudo podman run --rm --privileged --security-opt label=disable \
            -v /dev:/dev -v "$PWD/output:/out:ro" ghcr.io/tuna-os/tacklebox:latest \
            verify /out/utah-main-tacklebox.iso 2>&1 | tee evidence/tbx-verify.log
      - name: Check the ISO is within the size budget
        run: |
          set -euo pipefail
          size_bytes=$(stat -c %s output/utah-main-tacklebox.iso)
          limit=$((6 * 1024 * 1024 * 1024))
          echo "utah-main-tacklebox.iso is $size_bytes bytes"
          test "$size_bytes" -le "$limit" || { echo "ISO exceeds the size budget" >&2; exit 1; }
      - name: Live-boot and observe the UTAH_LIVE_READY marker
        env:
          UTAH_ISO_BOOT_TIMEOUT: 1800
        run: |
          set -euo pipefail
          bash iso/scripts/tacklebox-boot-gate.sh "$PWD/output/utah-main-tacklebox.iso" UTAH_LIVE_READY \
            2>&1 | tee evidence/tbx-boot.log
      - name: Preserve diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tacklebox-iso-diagnostics-utah
          retention-days: 14
          if-no-files-found: warn
          path: |
            evidence/
