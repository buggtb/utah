repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 2c9f875913ee60ca25ce70243dc24d5b6415598c # v4.6.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: detect-private-key
        # Documented exception: packages/secureboot/utah-mok.priv is Utah's
        # Secure Boot MOK private key, committed deliberately like
        # ublue-os/akmods' certs/. Trust comes from the physical-presence
        # MokManager enrollment, not key secrecy; the key enters only the
        # kernel-cache builder stage and never ships in an image layer.
        exclude: '^packages/secureboot/utah-mok\.priv$'
      - id: check-added-large-files
  - repo: https://github.com/rhysd/actionlint
    rev: 03d0035246f3e81f36aed592ffb4bebf33a03106 # v1.7.7
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: no-floating-action-tags
        name: Block floating GitHub Action tags (@main, @v*)
        language: pygrep
        entry: 'uses:(?!.*projectbluefin/).*@(main|master|latest|v[0-9])'
        types: [yaml]
        files: '\.github/workflows/'
      - id: check-skill-frontmatter
        name: Validate skill front-matter
        language: system
        entry: bash scripts/check-skill-frontmatter.sh
        pass_filenames: false
        always_run: true
      - id: check-skill-index
        name: Validate docs/SKILL.md skill index
        language: system
        entry: bash scripts/check-skill-index.sh
        pass_filenames: false
        always_run: true
      - id: check-skill-catalog
        name: Validate docs/skills/index.json is up to date
        language: system
        entry: python3 scripts/generate_skill_index.py --check
        pass_filenames: false
        always_run: true
